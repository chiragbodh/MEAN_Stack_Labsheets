<main>
<h1>{{ title }}</h1>
<p class="student">Chirag Bodh · MCA · MCFS203P</p>
<label for="message">Message</label><textarea id="message" rows="5" [(ngModel)]="message"></textarea><p [class.error]="message.length > limit" aria-live="polite">Characters: {{ message.length }} · Remaining: {{ limit - message.length }}</p><p *ngIf="message.length > limit" class="error">Limit exceeded by {{ message.length - limit }} characters.</p>
</main>
